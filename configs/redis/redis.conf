# =============================================================================
# Redis Configuration — Agent Crawler
# =============================================================================
# Optimized for job queue + checkpointing workload

# ── Network ──────────────────────────────────────────────────────────────────
bind 0.0.0.0
port 6379
protected-mode no
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ── Memory ───────────────────────────────────────────────────────────────────
maxmemory 256mb
maxmemory-policy allkeys-lru

# ── Persistence (AOF) ────────────────────────────────────────────────────────
# Append-only file for durable job queue
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ── Persistence (RDB snapshots) ──────────────────────────────────────────────
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data

# ── Logging ──────────────────────────────────────────────────────────────────
loglevel notice

# ── Clients ──────────────────────────────────────────────────────────────────
maxclients 1000

# ── Slow Log ─────────────────────────────────────────────────────────────────
slowlog-log-slower-than 10000
slowlog-max-len 128
