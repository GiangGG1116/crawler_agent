name: CI — Agent Crawler

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Lint + Type Check
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff>=0.1.0

      - name: Ruff check (agent integration surface)
        run: |
          ruff check \
            services/agent-service \
            services/api-gateway/src/services/job_router.py \
            services/api-gateway/src/services/service_caller.py \
            packages/shared-lib/shared/utils/config.py \
            packages/shared-lib/shared/utils/network.py \
            --config pyproject.toml

      - name: Ruff format check
        run: |
          ruff format --check \
            services/agent-service \
            services/api-gateway/src/services/job_router.py \
            services/api-gateway/src/services/service_caller.py \
            packages/shared-lib/shared/utils/config.py \
            packages/shared-lib/shared/utils/network.py

  # ──────────────────────────────────────────────────────────────────────────
  # Unit Tests — per service
  # ──────────────────────────────────────────────────────────────────────────
  test-shared:
    name: Test shared-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: pip install -e packages/shared-lib[dev] 2>/dev/null || pip install -e packages/shared-lib
      - name: Verify import
        run: python -c "from shared.utils.config import get_settings; print('shared-lib OK')"

  test-api-gateway:
    name: Test api-gateway
    runs-on: ubuntu-latest
    needs: test-shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: |
          pip install -e packages/shared-lib
          pip install -e services/api-gateway
          pip install pytest pytest-asyncio httpx
      - name: Run tests
        working-directory: services/api-gateway
        run: python -m pytest tests/ -v --tb=short
        env:
          REDIS_URL: "redis://localhost:6379/0"

  test-crawler-service:
    name: Test crawler-service
    runs-on: ubuntu-latest
    needs: test-shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: |
          pip install -e packages/shared-lib
          pip install -e services/crawler-service
          pip install pytest pytest-asyncio
      - name: Run tests
        working-directory: services/crawler-service
        run: python -m pytest tests/ -v --tb=short

  test-data-processor:
    name: Test data-processor
    runs-on: ubuntu-latest
    needs: test-shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: |
          pip install -e packages/shared-lib
          pip install -e services/data-processor
          pip install pytest pytest-asyncio
      - name: Run tests
        working-directory: services/data-processor
        run: python -m pytest tests/ -v --tb=short

  test-agent-service:
    name: Test agent-service
    runs-on: ubuntu-latest
    needs: test-shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: |
          pip install -e packages/shared-lib
          pip install -e services/agent-service
          pip install pytest pytest-asyncio
      - name: Run tests
        working-directory: services/agent-service
        run: python -m pytest tests/ -v --tb=short
        env:
          CHECKPOINT_BACKEND: sqlite
          LANGFUSE_ENABLED: "false"

  # ──────────────────────────────────────────────────────────────────────────
  # Docker Build — verify all images build
  # ──────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-api-gateway, test-crawler-service, test-agent-service, test-data-processor]
    strategy:
      matrix:
        service:
          - api-gateway
          - crawler-service
          - agent-service
          - data-processor
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          tags: agent-crawler/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────────────────
  # Security Scan
  # ──────────────────────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check for secrets in code
        run: |
          # Simple check for hardcoded secrets
          if grep -rn "password\s*=\s*['\"]" --include="*.py" services/ packages/ | grep -v "test" | grep -v "#" | grep -v "Field(" | grep -v "description="; then
            echo "⚠️  Potential hardcoded secrets found"
            exit 1
          fi
          echo "✅ No hardcoded secrets detected"

      - name: Check .env not committed
        run: |
          if [ -f .env ]; then
            echo "⚠️  .env file should not be in the repository"
            exit 1
          fi
          echo "✅ .env not committed"
