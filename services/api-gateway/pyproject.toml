[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "api-gateway"
version = "1.0.0"
description = "API Gateway — REST entry point for Agent Crawler microservices"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.25.0",
    "redis[hiredis]>=5.0.0",
    "tenacity>=8.2.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "crawler-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "httpx",
]

[project.scripts]
crawler = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["**/*.json", "**/*.yaml"]
