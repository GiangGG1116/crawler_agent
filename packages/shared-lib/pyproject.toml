[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawler-shared"
version = "1.0.9"
description = "Shared models and utilities for Agent Crawler microservices"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.25.0",
    "tenacity>=8.2.0",
    "python-dotenv>=1.0.0",
    "python-dateutil>=2.8.0",
]

[tool.setuptools.packages.find]
include = ["shared*"]
