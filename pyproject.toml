# Root-level ruff config — shared across all services.
# Individual services can override in their own pyproject.toml.

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["services", "packages"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
]
ignore = [
    "S101",  # assert used (OK in tests)
    "S603",  # subprocess call (sandboxed in run_tests.py)
    "S607",  # partial path
    "B008",  # function call in default argument (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106"]  # Allow asserts and hardcoded passwords in tests

[tool.ruff.lint.isort]
known-first-party = ["shared", "src"]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=8.0.1",
    "ruff>=0.15.16",
]
